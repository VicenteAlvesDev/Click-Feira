
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#174c32">
    <title>Sem conexão | ClickFeira</title>

    <link rel="icon" href="./assets/img/app-icon-192.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: #f7f5ef;
            color: #29332d;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 40px 25px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .logo {
            width: 180px;
            max-width: 80%;
            margin-bottom: 35px;
        }

        .icone {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #174c32;
            font-size: 25px;
            margin-bottom: 12px;
        }

        p {
            color: #747b72;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 25px;
            background: #79bf00;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #174c32;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <main class="container">

        <img
            src="./assets/img/logo-clickfeira.png"
            alt="ClickFeira"
            class="logo"
        >

        <div class="icone">📡</div>

        <h1>Você está sem conexão!</h1>

        <p>
            Parece que sua internet está indisponível no momento.
            Verifique sua conexão e tente acessar o ClickFeira novamente.
        </p>

        <button onclick="window.location.reload()">
            Tentar novamente
        </button>

    </main>
</body>
</html>
